<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.12"/></filter>
    <linearGradient id="btn" x1="0" x2="1"><stop stop-color="#6750b7"/><stop offset="1" stop-color="#7657be"/></linearGradient>
    <style>
      .title{font:700 36px sans-serif;fill:#17141c}.h1{font:700 25px sans-serif;fill:#17141c}.h2{font:700 20px sans-serif;fill:#17141c}.body{font:17px sans-serif;fill:#5e5867}.small{font:15px sans-serif;fill:#777181}.btn{font:700 19px sans-serif;fill:white}.card{fill:#fffafd;stroke:#ded7e3;stroke-width:2}.phone{fill:#fcf8fd;stroke:#c9c2ce;stroke-width:2}.accent{fill:#6d53b7}.green{fill:#1fb56b}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f6f0f8"/>

  <!-- left phone -->
  <rect x="45" y="25" rx="38" ry="38" width="625" height="850" class="phone" filter="url(#shadow)"/>
  <text x="80" y="70" class="small">13:37</text><text x="590" y="70" class="small">● ● 100%</text>
  <text x="80" y="125" class="title">欧唤</text>
  <text x="80" y="158" class="body">让电源键，唤醒你想要的助手</text>
  <text x="595" y="125" class="h1">⚙</text>

  <rect x="70" y="185" rx="26" width="575" height="150" class="card"/>
  <circle cx="110" cy="235" r="25" fill="#eee8ff"/><text x="101" y="243" class="h2">◇</text>
  <text x="155" y="225" class="h2">模块状态</text>
  <text x="155" y="258" class="h2" fill="#1fb56b">● 已生效</text>
  <text x="155" y="292" class="body">Hook：正常运行</text>
  <text x="155" y="318" class="body">作用域：system（仅系统框架）</text>

  <rect x="70" y="350" rx="26" width="575" height="130" class="card"/>
  <circle cx="110" cy="400" r="25" fill="#e6f0ff"/><text x="100" y="407" class="h2">◉</text>
  <text x="155" y="390" class="h2">当前系统默认助手</text>
  <text x="155" y="423" class="h1">小布助手</text>
  <rect x="275" y="400" rx="12" width="78" height="28" fill="#eee9ff"/><text x="288" y="420" class="small" fill="#6d53b7">系统助手</text>

  <rect x="70" y="495" rx="26" width="575" height="170" class="card"/>
  <circle cx="110" cy="545" r="25" fill="#efe8ff"/><text x="101" y="553" class="h2">ϟ</text>
  <text x="155" y="535" class="h2">0.5 秒电源键当前助手</text>
  <text x="155" y="571" class="h1">未接管（系统原始目标）</text>
  <text x="155" y="602" class="body">点击下方按钮选择助手并接管</text>
  <rect x="95" y="618" rx="24" width="525" height="54" fill="url(#btn)"/>
  <text x="308" y="652" class="btn">选择助手  ›</text>

  <rect x="70" y="684" rx="26" width="575" height="105" class="card"/>
  <circle cx="110" cy="735" r="25" fill="#e4f7ee"/><text x="100" y="743" class="h2">◷</text>
  <text x="155" y="725" class="h2">最近一次调用</text>
  <text x="155" y="758" class="body">暂无调用记录</text>

  <rect x="75" y="808" rx="22" width="255" height="48" fill="none" stroke="#8b8392" stroke-width="2"/>
  <rect x="360" y="808" rx="22" width="255" height="48" fill="none" stroke="#8b8392" stroke-width="2"/>
  <text x="155" y="839" class="h2" fill="#6d53b7">查看日志</text><text x="437" y="839" class="h2" fill="#6d53b7">诊断信息</text>

  <!-- right phone -->
  <rect x="730" y="25" rx="38" ry="38" width="625" height="850" class="phone" filter="url(#shadow)"/>
  <text x="765" y="70" class="small">13:37</text><text x="1270" y="70" class="small">● ● 100%</text>
  <text x="765" y="125" class="h1">←</text><text x="825" y="125" class="h1">选择助手</text>
  <text x="765" y="160" class="body">请选择要通过 0.5 秒电源键唤醒的语音助手</text>

  <rect x="755" y="190" rx="24" width="575" height="108" class="card"/>
  <circle cx="805" cy="244" r="28" fill="#fff"/><text x="788" y="254" class="h1">✦</text>
  <text x="855" y="235" class="h1">Gemini</text><text x="855" y="264" class="body">Google</text>
  <circle cx="1285" cy="244" r="16" fill="none" stroke="#6d53b7" stroke-width="3"/><circle cx="1285" cy="244" r="8" class="accent"/>

  <rect x="755" y="312" rx="24" width="575" height="108" class="card"/>
  <circle cx="805" cy="366" r="28" fill="#fff"/><text x="791" y="375" class="h1">◎</text>
  <text x="855" y="356" class="h1">ChatGPT</text><text x="855" y="385" class="body">OpenAI</text>
  <circle cx="1285" cy="366" r="16" fill="none" stroke="#9b95a1" stroke-width="3"/>

  <rect x="755" y="434" rx="24" width="575" height="108" class="card"/>
  <circle cx="805" cy="488" r="28" fill="#15191d"/><text x="790" y="497" class="h1" fill="#fff">✧</text>
  <text x="855" y="478" class="h1">Perplexity</text><text x="855" y="507" class="body">Perplexity AI</text>
  <circle cx="1285" cy="488" r="16" fill="none" stroke="#9b95a1" stroke-width="3"/>

  <rect x="755" y="556" rx="24" width="575" height="108" class="card"/>
  <circle cx="805" cy="610" r="28" fill="#fff2f5"/><text x="791" y="619" class="h1">◒</text>
  <text x="855" y="600" class="h1">小爱同学</text><text x="855" y="629" class="body">Xiaomi</text>
  <circle cx="1285" cy="610" r="16" fill="none" stroke="#9b95a1" stroke-width="3"/>

  <rect x="755" y="678" rx="24" width="575" height="88" fill="#f0ebfb"/>
  <text x="785" y="712" class="h2" fill="#6d53b7">ⓘ 仅显示已安装且可作为系统语音助手使用的应用</text>
  <text x="785" y="744" class="body">未找到想要的助手？请先安装对应应用</text>

  <rect x="755" y="790" rx="26" width="575" height="62" fill="url(#btn)"/>
  <text x="1000" y="829" class="btn">确定</text>
</svg>