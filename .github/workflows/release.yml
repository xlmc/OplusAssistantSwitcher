name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Signed Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not in vX.Y.Z form"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<<"$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "code=$CODE" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then
              echo "::error::Missing repository secret: $s"
              missing=1
            fi
          done
          exit $missing

      - name: Restore keystore (runner-local, destroyed with the runner)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ouhuan-release.jks"

      - name: Build signed release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --stacktrace \
            -PversionName="$VERSION" \
            -PversionCode="$CODE" \
            -PreleaseStoreFile="$RUNNER_TEMP/ouhuan-release.jks" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"

      - name: Verify signature and versionName against tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          APK="app/build/outputs/apk/release/OplusAssistantSwitcher-v${VERSION}.apk"
          [ -f "$APK" ] || { echo "::error::Release APK missing or misnamed: $APK"; ls -la app/build/outputs/apk/release/; exit 1; }
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/"* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" >/dev/null \
            || { echo "::error::APK signature verification failed"; exit 1; }
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -a "^package: " | grep -aq "versionName='${VERSION}'" \
            || { echo "::error::versionName does not match tag (expected ${VERSION})"; echo "$BADGING" | grep '^package:'; exit 1; }
          echo "$BADGING" | grep -a "^package: " | grep -aq "versionCode='${CODE}'" \
            || { echo "::error::versionCode does not match expected ${CODE}"; exit 1; }

      - name: Verify Xposed metadata (java_init.list / module.prop / scope.list)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash .github/scripts/verify_xposed_meta.sh \
            "app/build/outputs/apk/release/OplusAssistantSwitcher-v${VERSION}.apk"

      - name: Generate SHA-256 checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/release/OplusAssistantSwitcher-v${VERSION}.apk"
          cp "$APK" "dist/OplusAssistantSwitcher-v${VERSION}.apk"
          sha256sum "dist/OplusAssistantSwitcher-v${VERSION}.apk" \
            > "dist/OplusAssistantSwitcher-v${VERSION}.apk.sha256"
          cat "dist/OplusAssistantSwitcher-v${VERSION}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "欧唤 Oplus Assistant Switcher $TAG" \
            --generate-notes
